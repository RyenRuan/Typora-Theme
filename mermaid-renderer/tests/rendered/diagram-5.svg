</style></defs><g class="rym-node" data-node-id="N1" filter="url(#rym-a52c499f-green-glow)"><rect x="58.0" y="230.5" width="132.0" height="64.0" rx="32.0" fill="#10291e" fill-opacity=".94" stroke="#35d483" stroke-width="2.3"/><text class="rym-node-text" x="124.0" y="267.5"><tspan x="124.0" dy="0.0">开始</tspan></text></g><g class="rym-node" data-node-id="N2" filter="url(#rym-a52c499f-purple-glow)"><rect x="232.0" y="216.0" width="160.0" height="93.0" rx="12.0" fill="#21172b" fill-opacity=".94" stroke="#a566ff" stroke-width="2.3"/><text class="rym-node-text" x="312.0" y="247.5"><tspan x="312.0" dy="0.0">收集来自客户端、</tspan><tspan x="312.0" dy="20.0">服务端与运营后台</tspan><tspan x="312.0" dy="20.0">的原始需求</tspan></text></g><g class="rym-node" data-node-id="N3" filter="url(#rym-a52c499f-purple-glow)"><rect x="434.0" y="216.0" width="160.0" height="93.0" rx="12.0" fill="#21172b" fill-opacity=".94" stroke="#a566ff" stroke-width="2.3"/><text class="rym-node-text" x="514.0" y="247.5"><tspan x="514.0" dy="0.0">识别必须保留的业</tspan><tspan x="514.0" dy="20.0">务事实和不可变约</tspan><tspan x="514.0" dy="20.0">束</tspan></text></g><g class="rym-node" data-node-id="N4" filter="url(#rym-a52c499f-orange-glow)"><path d="M 725.0 202.0 L 814.0 262.5 L 725.0 323.0 L 636.0 262.5 Z" fill="#352812" fill-opacity=".94" stroke="#ff741c" stroke-width="2.3" stroke-linejoin="round"/><text class="rym-node-text" x="725.0" y="257.5"><tspan x="725.0" dy="0.0">信息是否足以形成</tspan><tspan x="725.0" dy="20.0">可执行方案?</tspan></text></g><g class="rym-node" data-node-id="N5" filter="url(#rym-a52c499f-purple-glow)"><rect x="645.0" y="58.0" width="160.0" height="72.0" rx="12.0" fill="#21172b" fill-opacity=".94" stroke="#a566ff" stroke-width="2.3"/><text class="rym-node-text" x="725.0" y="89.0"><tspan x="725.0" dy="0.0">补充缺失的验收条</tspan><tspan x="725.0" dy="20.0">件</tspan></text></g><g class="rym-node" data-node-id="N6" filter="url(#rym-a52c499f-purple-glow)"><rect x="856.0" y="216.0" width="160.0" height="93.0" rx="12.0" fill="#21172b" f